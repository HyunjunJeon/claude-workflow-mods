# Re-runs the 8 shape scenarios of eval/scenarios.ts after Phase 2 (planning doctrine) and Phase 3 (alignment before start)
# and compares the result with the Phase 0 baseline. The Phase 0 files under eval/baselines/ are read inputs only: this
# definition never writes them. Its own outputs are eval/baselines/rerun-shard-<k>.md, rerun-baseline.md,
# rerun-baseline-audit.md and rerun-vs-p0.md.
#
# Run:   /dag run flows/improvement/eval-rerun.yaml
# Check: bun eval/check-definition.ts flows/improvement/eval-rerun.yaml
#
# Re-running after this run has settled needs a NEW key (for example eval-rerun-p3-2): the same key with the same
# definition returns the old run and schedules nothing.
#
# Cost: the four shard nodes start 8 claude -p sessions on your account (about 2-4 minutes each, 4 sessions at a time).
# eval/results/ is gitignored, so each shard copies its runner rows into a tracked file under eval/baselines/.
#
# Table: eval/run.ts renders 21 columns. Compared with the Phase 0 table (20 columns) the new column
# "AskUserQuestion calls" sits right after "refusals (planning/tools)". The audit therefore compares 8 rows x 21 cells = 168.
#
# Timeouts: each shard runs its two scenarios one after the other (--concurrency 1) inside one Bash call, which is capped at
# 600000 ms. So the runner gets --timeout-min 4 per scenario (about 60 s wait + 2 x 4 min worst case); the Phase 0 runs took
# 52-212 s each, but a scenario that does exceed 4 minutes is recorded as a timed-out row in the re-run table. Rejected
# alternative: --concurrency 2 --timeout-min 8 per shard (more margin per scenario, but 8 sessions at once instead of 4).
#
# Shape: shard-1..shard-4 (parallel, two scenarios each) -> baseline-combine -> baseline-audit -> compare-p0.
# The runner stamps its output files with a one-second clock, so two runners started in the same second overwrite each
# other. Each shard therefore waits for its own seconds window of the minute before it starts the runner.
key: eval-rerun-p3-1
name: Eval re-run after P2 and P3
goal: eval/baselines/rerun-baseline.md holds the 8 rows of the eval re-run after Phases 2 and 3 with summary lines recomputed from the runner JSON results, an independent audit confirms it row by row, and eval/baselines/rerun-vs-p0.md compares it with eval/baselines/p0-baseline.md.
nodes:
  - id: shard-1
    label: Run single-edit and parallel-files
    category: quick
    writes:
      - eval/baselines/rerun-shard-1.md
    verify:
      - kind: file
        path: eval/baselines/rerun-shard-1.md
        contains: "Results JSON: eval/results/"
      - kind: file
        path: eval/baselines/rerun-shard-1.md
        contains: "| single-edit | single |"
      - kind: file
        path: eval/baselines/rerun-shard-1.md
        contains: "| parallel-files | parallel |"
      - kind: command
        argv:
          - bun
          - -e
          - |
            const fs = require('node:fs')
            const [k, ...ids] = process.argv.slice(1)
            const fail = msg => { console.error(`shard ${k}: ${msg}`); process.exit(1) }
            const shard = fs.readFileSync(`eval/baselines/rerun-shard-${k}.md`, 'utf8')
            const m = /^Results JSON: (eval\/results\/\d{14}\.json)$/m.exec(shard)
            if (!m) fail('no "Results JSON: eval/results/<stamp>.json" line')
            const found = JSON.parse(fs.readFileSync(m[1], 'utf8')).results
            if (found.map(r => r.id).join() !== ids.join()) fail(`${m[1]} holds ${found.map(r => r.id).join()}, expected ${ids.join()} (another runner may have overwritten the stamp)`)
            for (const r of found) {
              const cell = r.runs.map(x => `${x.shape} (producers: ${x.producerShape})`).join('; ') || 'no run'
              const row = shard.split('\n').find(l => l.startsWith(`| ${r.id} | ${r.expect} |`))
              if (!row) fail(`no table row for ${r.id}`)
              if (!row.includes(`| ${cell} |`) || !row.endsWith(`| ${r.seconds}s |`)) fail(`the row for ${r.id} does not match ${m[1]}`)
            }
          - "1"
          - single-edit
          - parallel-files
    prompt: |
      TASK: Run the eval scenarios single-edit and parallel-files through the shape runner and record their two result rows in eval/baselines/rerun-shard-1.md.
      DELIVERABLE: eval/baselines/rerun-shard-1.md, written after the runner finishes (create the folder eval/baselines/ when it is missing). Its content, in this order:
        1. the line "# Eval re-run shard 1"
        2. one line each, with nothing after the value: "Date: <output of date +%F>", "Plugin HEAD: <output of git rev-parse --short HEAD>", "Tracked changes: <number of lines printed by git status --porcelain --untracked-files=no>", "Scenarios: single-edit, parallel-files", "Stamp: <the 14-digit stamp in the runner output file name>", "Results JSON: eval/results/<stamp>.json", "Results MD: eval/results/<stamp>.md", "Command: <the exact runner command you ran, starting at bun eval/run.ts>"
        3. a blank line, then the runner's table header line and separator line copied verbatim from eval/results/<stamp>.md, then the rows for single-edit and parallel-files copied verbatim from that file (every cell unedited, one line per row, in that order).
        In ## Output give the stamp, the Results JSON path and, per scenario, the shape, the outcome check (PASS or FAIL), the status and the seconds.
      SCOPE: Run the shape runner exactly once, with the command below. Its side effects are expected: it starts claude -p sessions on the user account, writes eval/results/<stamp>.md and eval/results/<stamp>.json (gitignored) and uses /tmp/dag-shapes/<stamp>. Read eval/run.ts and eval/results/. Write only eval/baselines/rerun-shard-1.md. Do not edit eval/*.ts, the other shard files or any other file. NEVER commit, push, install anything or reload plugins, and never edit anything under .claude/.
      Procedure:
        1. Run this one Bash command with the Bash timeout parameter set to 600000 ms. The run takes about 4 minutes. Never run it in the background and never start a second runner for the same scenarios, because every run spends the user account usage.
           bun -e "const k=0;for(;;){const s=new Date().getSeconds();if(s>=15*k+3&&s<=15*k+9)break;await Bun.sleep(100)}" && bun eval/run.ts --only single-edit,parallel-files --concurrency 1 --timeout-min 4
           The first part waits until the clock is in this shard's own seconds window of the minute (shard 1 seconds 3-9, shard 2 seconds 18-24, shard 3 seconds 33-39, shard 4 seconds 48-54). The runner names its output files by a one-second clock stamp and two runners that start in the same second overwrite each other, so the disjoint windows keep the four stamps distinct. Run the command exactly as written.
        2. The runner prints a line SHAPES_DONE <path>/<stamp>.md ...; the stamp is that file name without its extension. When the call ended without a SHAPES_DONE line, stop and report failed with the last output lines.
        3. Read eval/results/<stamp>.json. Its results array must hold exactly the ids single-edit and parallel-files; anything else means another runner overwrote the stamp, so report failed. When the table shows "no run" for both scenarios, the claude sessions never started: report failed and quote the stdoutTail text.
        4. Write the shard file. Copy the rows even when the outcome check is FAIL, the shape differs from the expected one or a scenario timed out: they are re-run measurements, so do not rerun anything to improve them.
      VERIFY: Re-read eval/baselines/rerun-shard-1.md and confirm that it has the Stamp, Results JSON and Command lines and that its two rows start with "| single-edit | single |" and "| parallel-files | parallel |". The runtime also runs a script that compares both rows with the Results JSON file.
      STOP WHEN: eval/baselines/rerun-shard-1.md exists with both rows and your ## Output section is written.

