      SCOPE: READ-ONLY on everything except notes/p2-review-spec.md. Read docs/improvement-plan.md, skills/dag-planning/references/planning.md IN FULL, skills/dag-planning/SKILL.md, skills/dag-node-debugging/SKILL.md, skills/dag-node-review-standards/SKILL.md, skills/dag-node-testing/SKILL.md, THIRD_PARTY_NOTICES.md, and run `git status --short` and `git diff -- skills/dag-planning` to separate this run's changes from earlier work. The Standards axis (consistency with existing doctrine, README.md, lint and runtime rules) belongs to the review-standards node: do not judge it here. NEVER run git commit or git push, never run an install command (npm, bun add, pip, brew), never reload plugins (/reload-plugins), and never edit anything under .claude/.
      VERIFY: for every plan item quote the exact line of the repository file that satisfies it; write PASS only for an item whose evidence you read in the file. The runtime checks that the notes file contains `Spec verdict: PASS`, `Plan item 2a: PASS` and `Plan item 2e: PASS`, so a FAIL verdict fails this node.
      STOP WHEN: every item has a supported verdict and the file is written. When any item is FAIL or Extras is not empty, write `Spec verdict: FAIL` and end with `DAG_NODE_STATUS: failed: <which items failed>`.

  - id: review-standards
    label: Standards review of the Phase 2 deliverables
    category: unspecified-low
    dependsOn:
      - synthesize-planning
      - skill-debugging
      - skill-review-standards
      - skill-testing
      - third-party-notices
    writes:
      - notes/p2-review-standards.md
    verify:
      - kind: file
        path: notes/p2-review-standards.md
        contains: "Standards verdict: PASS"
      - kind: file
        path: notes/p2-review-standards.md
        contains: "## Standards"
      - kind: command
        argv: [claude, plugin, validate, "."]
    prompt: |
      TASK: Independently judge whether the Phase 2 deliverables are consistent with the existing doctrine, README.md and the plugin's lint and runtime rules, with no contradictions, and write the verdict to notes/p2-review-standards.md.
      Background: this is the Standards axis of a two-axis review; a sibling node judges the Spec axis separately, so do not judge whether the plan items are all present. The deliverables are: the four new subsections of skills/dag-planning/references/planning.md (`### Two-axis review (code-changing runs)`, `### Safe-but-wrong audit checklist`, `### Vertical slices and wide refactors`, `### Debug chain (diagnose run, then fix run)`), the pointers in skills/dag-planning/SKILL.md, the three skills skills/dag-node-debugging/SKILL.md, skills/dag-node-review-standards/SKILL.md and skills/dag-node-testing/SKILL.md, and THIRD_PARTY_NOTICES.md. The upstream outputs above are claims until you check them against the files. Read skills/dag-node-review-standards/SKILL.md first (written earlier in this same run; read it with the Read tool, it is not preloaded) and follow its report shape; where it and this prompt differ, this prompt wins.

      DELIVERABLE: notes/p2-review-standards.md with a `## Standards` section holding (a) documented-standard violations (hard, each citing the file and the rule) and (b) possible smells (judgment calls, each named "possible <Smell>" with the quoted passage), a one-line summary with the count per kind and the worst issue, and a final line `Standards verdict: PASS` (only when there is no documented-standard violation and no contradiction) or `Standards verdict: FAIL (<n> violations)`. Check these rules:
      - Existing doctrine in planning.md: no new text contradicts the sections "Decomposition doctrine" (including "Split implementation from its test? No", "Unknown cause: investigate, then fix", "Do not split when" and the one-deliverable-per-node rule), "Category routing" (the final audit never runs on quick; the two review nodes must be routed unspecified-low or higher), "Edges, data and write scopes", "Node prompt contract" (five markers TASK:, DELIVERABLE:, SCOPE:, VERIFY:, STOP WHEN in any prompt skeleton), "The verify contract" (checks that can fail; no deliverable named REPORT*, SUMMARY*, FINDINGS* or ANALYSIS*) and "Failure playbook". Every example node, edge and `verify` in the new text must itself satisfy these rules.
      - Plugin rules against code: compare the new text with hooks/engine/lint.ts (what `lintDefinition` warns about, including any vacuous-verify rules that earlier phases added), hooks/engine/node-prompt.ts (the `DAG_NODE_STATUS:` grammar, `## Output`, `load_skills`, the category table), hooks/engine/definition.ts and hooks/engine/verification.ts (verify and writes limits). A statement in the doctrine that the code contradicts is a violation.
      - README.md: the sections "계획 스킬", "정의 형식", "검증" and "자동 복구" must not be contradicted. README staleness that is not a contradiction (for example the content list of planning.md being less detailed than the new text) is a possible smell, never a violation, and you do not edit README.md.
      - The three skills: the frontmatter has the same shape as skills/dag-planning/SKILL.md (name equals the directory name, description, when_to_use); no step waits for a user answer; no step tells the worker to commit, push, install or reload plugins; the attribution line points at THIRD_PARTY_NOTICES.md; the Standards skill states the verdict-line grammar the planning.md subsection uses (`Standards verdict: PASS`).
      - THIRD_PARTY_NOTICES.md: each notice has its MIT license text and its adapted-file list, and the listed files exist.
      - Smell baseline, as judgment calls only: duplicated doctrine text between planning.md, SKILL.md and the skills, and abstractions or rules added for needs nobody stated (Speculative Generality).
      In ## Output give the verdict, the counts per kind, and the worst issue.

      SCOPE: READ-ONLY on everything except notes/p2-review-standards.md. Read skills/dag-node-review-standards/SKILL.md, the deliverables above, skills/dag-planning/references/planning.md IN FULL, README.md, hooks/engine/lint.ts, hooks/engine/node-prompt.ts, hooks/engine/definition.ts, hooks/engine/verification.ts, and run `git diff -- skills/dag-planning` to see this run's changes. Run `claude plugin validate .` yourself and read its output for warnings that name the new skills. The Spec axis (is every plan item present, anything extra) belongs to the review-spec node: do not judge it here. NEVER run git commit or git push, never run an install command (npm, bun add, pip, brew), never reload plugins (/reload-plugins), and never edit anything under .claude/.
      VERIFY: run `claude plugin validate .` and expect exit code 0 with no warning that names one of the three new skills; record the result in the notes file. The runtime runs the same command and checks that the notes file contains `## Standards` and `Standards verdict: PASS`, so a FAIL verdict fails this node.
      STOP WHEN: the checks above are done and the file is written. When any documented-standard violation or contradiction exists, write `Standards verdict: FAIL (<n> violations)` and end with `DAG_NODE_STATUS: failed: <n> documented-standard violations`.

  # ---- Last: record the outcome in the progress table ----
  - id: progress-log
    label: Record P2 in the progress table
    category: quick
    dependsOn:
      - review-spec
      - review-standards
    writes:
      - docs/improvement-plan.md
    verify:
      - kind: file
        path: docs/improvement-plan.md
        contains: "| P2 | 완료 | 20"
      - kind: file
        path: docs/improvement-plan.md
        contains: "| P3 | 대기 | | |"
    prompt: |
      TASK: Update ONLY the P2 row of the progress table under the heading "## 진행 기록" in docs/improvement-plan.md to record that this run finished.
      Background: both review outputs above must report a PASS verdict (`Spec verdict: PASS` and `Standards verdict: PASS`). If either output reports FAIL or lacks its verdict line, change nothing and end with `DAG_NODE_STATUS: failed: review verdict is not PASS`.

      DELIVERABLE: the row that now reads `| P2 | 대기 | | |` becomes `| P2 | 완료 | <date> | <memo> |` where
      - `<date>` is the output of the command `date +%F` (run it; do not guess the date);
      - `<memo>` is one line in Korean, with no `|` character, that starts with this run's id (the `run dag_...` id in the first sentence of your instructions), followed by a colon, a short result (what was added to planning.md, the three node skills, THIRD_PARTY_NOTICES.md, both reviews passed) and the words "eval 재실행은 별도".
      Every other line of the file stays byte for byte as it was, including the P0, P1 and P3 rows and the rest of the table.
      In ## Output give the final text of the P2 row.

      SCOPE: Edit ONLY the P2 row of docs/improvement-plan.md. Do not touch any other row, section or file. NEVER run git commit or git push, never run an install command (npm, bun add, pip, brew), never reload plugins (/reload-plugins), and never edit anything under .claude/.
      VERIFY: read the P2 row back, and run `git diff -- docs/improvement-plan.md` to confirm that no line other than the P2 row of the progress table was changed by you (earlier phases may have changed other lines before this run; leave them alone). The runtime checks that the file contains `| P2 | 완료 | 20` and still contains `| P3 | 대기 | | |`.
      STOP WHEN: the P2 row shows the 완료 status, the date and the memo, and no other row changed.
