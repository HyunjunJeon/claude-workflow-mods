# Implements docs/improvement-plan.md, "Phase 2 - 계획 지침", items 2a-2e: the planning doctrine in
# skills/dag-planning/references/planning.md (2a two-axis review, 2b safe-but-wrong audit checklist, 2c vertical slices and
# wide refactors, 2d debug chain), the three vendored node skills (2e) and THIRD_PARTY_NOTICES.md.
#
# Assumed decisions (docs/improvement-plan.md, "먼저 정할 것"):
#   D3 option (a): the debug chain is a diagnosis run and a fix run, two runs, because verify is fixed when a run starts.
#   D4 option (b): extracts of the mattpocock skills are vendored as dag-workflow skills (skills/dag-node-*), not installed.
#   D5: the two review nodes are both end nodes of the graph; there is no aggregator node.
#
# Run:   /dag run flows/improvement/p2-planning-doctrine.yaml
# Check: bun eval/check-definition.ts flows/improvement/p2-planning-doctrine.yaml
#
# Re-running after this run has settled needs a NEW key (for example improve-p2-planning-doctrine-2): the same key with the
# same definition returns the old run and schedules nothing, and the same key with a changed definition is refused.
# The eval re-run that follows P2 (docs/improvement-plan.md, "순서") reuses flows/improvement/p0-eval-baseline.yaml under a
# new key; it is not a node of this file.
#
# Not part of this run: confirming that load_skills: ["dag-workflow:dag-node-debugging"] resolves inside a node. The installed
# plugin reads this folder directly, so it needs /reload-plugins first (never while a run is active, decision D1) and then
# a one-node run that loads the skill.
#
# Order: run P0 and P1 first and let them settle. P1 edits the verification paragraph of planning.md, which the synthesis node
# here edits too, and every phase's progress-log node edits docs/improvement-plan.md, so the phase runs must not overlap.
# The lane drafts notes/p2-*.md and the review notes stay on disk as the audit trail.
#
# Shape: draft-2a..draft-2d (parallel lanes) -> synthesize-planning. In the same first wave, skill-debugging,
# skill-review-standards, skill-testing and third-party-notices write their own files (8 nodes, the default max_concurrent).
# review-spec and review-standards (the two end nodes of the verification wave, decision D5) depend on synthesize-planning
# and those four file writers; they judge the final files, so they do not depend on the draft lanes, whose content reaches
# them through synthesize-planning. progress-log depends on both reviews.
# review-standards reads skills/dag-node-review-standards/SKILL.md with Read instead of load_skills: a skill directory
# created during a run does not resolve until /reload-plugins, which must not run while a run is active.
#
# Categories: quick for the mechanical notices file and the progress row. writing for the doctrine drafts and the three
# skills (documentation prose). unspecified-low for synthesize-planning (judgment: merge four drafts into an existing
# doctrine without contradicting it) and for both reviews (the standing final-audit exception: judgment, not a command).
key: improve-p2-planning-doctrine-1
name: Improvement P2 - planning doctrine
goal: "skills/dag-planning/references/planning.md carries plan items 2a-2d (two-axis review template, safe-but-wrong audit checklist, vertical-slice and expand-migrate-contract decomposition, two-run debug chain), the plugin has the node skills dag-node-debugging, dag-node-review-standards and dag-node-testing plus THIRD_PARTY_NOTICES.md with the MIT notices of mattpocock/skills and Q00/ouroboros, an independent spec review and an independent standards review both pass, and the P2 row of docs/improvement-plan.md records the outcome."
nodes:
  # ---- Wave 1a: doctrine drafts, one lane per plan item, each in its own notes file ----
  - id: draft-2a
    label: Draft 2a two-axis review template
    category: writing
    writes:
      - notes/p2-2a-two-axis-wave.md
    verify:
      - kind: file
        path: notes/p2-2a-two-axis-wave.md
        contains: "### Two-axis review (code-changing runs)"
      - kind: file
        path: notes/p2-2a-two-axis-wave.md
        contains: "review-spec"
      - kind: file
        path: notes/p2-2a-two-axis-wave.md
        contains: "review-standards"
      - kind: file
        path: notes/p2-2a-two-axis-wave.md
        contains: "Spec verdict: PASS"
      - kind: file
        path: notes/p2-2a-two-axis-wave.md
        contains: "Standards verdict: PASS"
      - kind: file
        path: notes/p2-2a-two-axis-wave.md
        contains: "unspecified-low"
      - kind: file
        path: notes/p2-2a-two-axis-wave.md
        contains: "dag-workflow:dag-node-review-standards"
    prompt: |
      TASK: Write the draft of plan item 2a, the two-axis template for the verification wave of code-changing runs, as notes/p2-2a-two-axis-wave.md.
      Background: this repository is the dag-workflow Claude Code plugin. skills/dag-planning/references/planning.md is its planning doctrine, and a later node integrates your draft into it. Plan item 2a (docs/improvement-plan.md, section "Phase 2", item 2a) asks for:
      - a `review-spec` node that judges the result against the goal and the request for (a) missing or partial implementation, (b) behavior nobody requested (scope creep), (c) things that are implemented but look wrong, each finding quoting the request sentence it rests on;
      - a `review-standards` node that judges against the repository's rule files (CONTRIBUTING, CLAUDE.md and similar) plus the Fowler code-smell baseline, where smells are always labelled judgment calls and a documented repository rule overrides the baseline;
      - the template applies only to runs that change code; documentation and research runs keep the existing single verification node, because the two-node wave costs extra nodes and time;
      - decision D5: both review nodes are end nodes of the graph and there is no aggregator node, because the axes are deliberately not merged or re-ranked and the run-settled summary already shows every node output side by side.

      DELIVERABLE: notes/p2-2a-two-axis-wave.md with three parts.
      Part 1: the literal line `Target heading: ### Two-axis review (code-changing runs)`, then the ready-to-paste doctrine text of that subsection (English, in the style of planning.md, at most 60 lines). It covers: when the template applies and when the single verification node stays; the shape (both nodes depend on ALL producer nodes, nothing depends on them, no aggregator, both run on `unspecified-low` or higher under the standing final-audit rule); what each node judges, as listed above; the fixed verdict lines `Spec verdict: PASS` / `Spec verdict: FAIL` and `Standards verdict: PASS` / `Standards verdict: FAIL`, with the rule that a FAIL verdict ends the node with `DAG_NODE_STATUS: failed: <what failed>`; the rule that each reviewer declares a `verify` file check whose `contains` is its own PASS verdict line, so a FAIL verdict fails the node; and the rule that the main conversation reads the two reports side by side and never merges or ranks findings across axes.
      Part 2: a ready-to-paste prompt skeleton for `review-spec` and one for `review-standards`. Each skeleton carries the five markers TASK:, DELIVERABLE:, SCOPE:, VERIFY:, STOP WHEN, has the reviewer write its own notes file (a name that does not start with REPORT, SUMMARY, FINDINGS or ANALYSIS), keeps the reviewer read-only on everything it reviews, and names its verdict line. The review-standards skeleton tells the planner to give that node `load_skills: ["dag-workflow:dag-node-review-standards"]`.
      Part 3: a line `Placement: under "## Verification wave"` and a `Conflicts` section listing every sentence of the current planning.md that this draft contradicts or that needs rewording (write `none` when there is none).
      In ## Output give the file path, the target heading, and the conflicts.

      SCOPE: Read skills/dag-planning/references/planning.md IN FULL, skills/dag-planning/SKILL.md, hooks/engine/lint.ts, and the Phase 2 section of docs/improvement-plan.md. Fetch the mattpocock source with `gh api repos/mattpocock/skills/contents/skills/engineering/code-review/SKILL.md --jq .content | base64 -d` and read it (MIT licensed: paraphrase it, do not paste long passages; in a DAG the reviewer cannot spawn sub-agents and cannot ask the user anything). Write ONLY notes/p2-2a-two-axis-wave.md. Do not edit planning.md or any other file; the 2b, 2c and 2d drafts, the skill nodes and the integration node belong to other nodes. NEVER run git commit or git push, never run an install command (npm, bun add, pip, brew), never reload plugins (/reload-plugins), and never edit anything under .claude/.
      VERIFY: Re-read your file and confirm it contains each of these literal strings: `### Two-axis review (code-changing runs)`, `review-spec`, `review-standards`, `Spec verdict: PASS`, `Standards verdict: PASS`, `unspecified-low`, `dag-workflow:dag-node-review-standards`. The runtime checks the same strings after you report.
      STOP WHEN: the file exists with all three parts and every literal string above is present. If `gh api` fails, do not invent the source text: end with `DAG_NODE_STATUS: failed: missing-input: gh api could not fetch the code-review source`.

  - id: draft-2b
    label: Draft 2b safe-but-wrong audit checklist
    category: writing
    writes:
      - notes/p2-2b-wrong-output-checklist.md
    verify:
      - kind: file
        path: notes/p2-2b-wrong-output-checklist.md
        contains: "### Safe-but-wrong audit checklist"
      - kind: file
        path: notes/p2-2b-wrong-output-checklist.md
        contains: "Audit prompt block"
      - kind: file
        path: notes/p2-2b-wrong-output-checklist.md
        contains: "partial/supporting-output"
      - kind: file
        path: notes/p2-2b-wrong-output-checklist.md
        contains: "DAG_NODE_STATUS: failed: partial/supporting-output"
      - kind: file
        path: notes/p2-2b-wrong-output-checklist.md
        contains: "safe-but-wrong"
    prompt: |
      TASK: Write the draft of plan item 2b, the "safe-but-wrong output" checklist that becomes a required part of the final audit prompt, as notes/p2-2b-wrong-output-checklist.md.
      Background: a run can be safe, non-destructive and even useful while still being wrong for what the user asked; the Q00/ouroboros guide docs/guides/safe-but-wrong-output.md names this failure mode. Plan item 2b (docs/improvement-plan.md, section "Phase 2", item 2b) requires the final audit prompt to carry these five items:
      1. the produced artifact is the same kind as the requested one (a CLI was requested, so documents alone do not count);
      2. the deliverable can be run again with new input;
      3. missing data is not displayed as OK, 0 or an empty value;
      4. the verification proved the behavior, not just that a file exists;
      5. on a shortfall the audit reports `partial/supporting-output`, not "complete".

      DELIVERABLE: notes/p2-2b-wrong-output-checklist.md with three parts.
      Part 1: the literal line `Target heading: ### Safe-but-wrong audit checklist`, then the ready-to-paste doctrine text of that subsection (English, in the style of planning.md, at most 50 lines): the failure mode in two sentences; the five items as a numbered list of questions that the final audit answers with evidence (command output, a file excerpt) instead of assertion; the rule that these five items are REQUIRED content of the final audit node's prompt (the node that nothing depends on and that judges two or more inputs); how a shortfall is reported: the audit writes `Status: partial/supporting-output` in its ## Output naming the missing artifact kind or behavior and ends with `DAG_NODE_STATUS: failed: partial/supporting-output - <what is missing>`, because the status line only knows completed and failed and the run must not be declared complete; and one sentence that a conservative default for a local, reversible gap is fine while a default that changes what kind of artifact is delivered is not.
      Part 2: a paste-ready block labelled `Audit prompt block` that a planner appends to a final audit prompt: the five items in imperative form, at most 12 lines.
      Part 3: a line `Placement: under "## Verification wave"` and a `Conflicts` section listing every sentence of the current planning.md that this draft contradicts or that needs rewording (write `none` when there is none).
      In ## Output give the file path, the target heading, and the conflicts.

      SCOPE: Read skills/dag-planning/references/planning.md IN FULL, skills/dag-planning/SKILL.md, hooks/engine/node-prompt.ts (the status line grammar) and the Phase 2 section of docs/improvement-plan.md. Fetch the source with `gh api repos/Q00/ouroboros/contents/docs/guides/safe-but-wrong-output.md --jq .content | base64 -d` and read it (MIT licensed: paraphrase it, do not paste long passages). Write ONLY notes/p2-2b-wrong-output-checklist.md. Do not edit planning.md or any other file; the 2a, 2c and 2d drafts, the skill nodes and the integration node belong to other nodes. NEVER run git commit or git push, never run an install command (npm, bun add, pip, brew), never reload plugins (/reload-plugins), and never edit anything under .claude/.
      VERIFY: Re-read your file and confirm it contains each of these literal strings: `### Safe-but-wrong audit checklist`, `Audit prompt block`, `partial/supporting-output`, `DAG_NODE_STATUS: failed: partial/supporting-output`, `safe-but-wrong`. The runtime checks the same strings after you report.
      STOP WHEN: the file exists with all three parts and every literal string above is present. If `gh api` fails, do not invent the source text: end with `DAG_NODE_STATUS: failed: missing-input: gh api could not fetch the safe-but-wrong-output guide`.

  - id: draft-2c
    label: Draft 2c decomposition rules
    category: writing
    writes:
      - notes/p2-2c-decomposition.md
    verify:
      - kind: file
        path: notes/p2-2c-decomposition.md
        contains: "### Vertical slices and wide refactors"
      - kind: file
        path: notes/p2-2c-decomposition.md
        contains: "vertical slice"
      - kind: file
        path: notes/p2-2c-decomposition.md
        contains: "blast radius"
      - kind: file
        path: notes/p2-2c-decomposition.md
        contains: "`expand`"
      - kind: file
        path: notes/p2-2c-decomposition.md
        contains: "`migrate`"
      - kind: file
        path: notes/p2-2c-decomposition.md
        contains: "`contract`"
    prompt: |
      TASK: Write the draft of plan item 2c, the decomposition rules for feature work and wide refactors, as notes/p2-2c-decomposition.md.
      Background: this repository is the dag-workflow Claude Code plugin; a later node integrates your draft into skills/dag-planning/references/planning.md. Plan item 2c (docs/improvement-plan.md, section "Phase 2", item 2c) says: keep the existing split by deliverable unit unchanged; define the unit of FEATURE work as a vertical slice that cuts a narrow but complete path through every layer (a tracer bullet), not a horizontal slice of one layer; sequence a wide refactor (one mechanical change whose blast radius fans across the codebase, so no single slice can land green) as an `expand` node, then `migrate` batches sized by blast radius, then a `contract` node, as a chain of nodes. The source is the mattpocock to-tickets skill.

      DELIVERABLE: notes/p2-2c-decomposition.md with two parts.
      Part 1: the literal line `Target heading: ### Vertical slices and wide refactors`, then the ready-to-paste doctrine text of that subsection (English, in the style of planning.md, at most 60 lines). It covers:
      - the unit of feature work is a vertical slice: it is demoable or verifiable on its own, sized to fit one node's context, and prefactoring (make the change easy first) is its own earlier node; one node owns the slice AND its tests, consistent with the existing rule "Split implementation from its test? No"; splitting one feature into a node per layer (schema, API, UI) is a horizontal slice and is wrong;
      - the wide-refactor chain, using the literal words `expand`, `migrate` and `contract` in backticks: an `expand` node adds the new form beside the old so nothing breaks; `migrate` nodes, one per batch sized by blast radius (per package or per directory), run in parallel ONLY when their write scopes are disjoint and otherwise chain; a `contract` node depends on EVERY `migrate` node and deletes the old form once no caller remains; give the node ids and the `dependsOn` edges of this chain as a small example list;
      - why a wide refactor is not forced into slices, and the plain limit of this plugin: there is no integration branch, per-node worktree isolation is backlog item B3 and out of scope, so batches that cannot stay green alone are merged into fewer nodes or serialized;
      - how this interacts with the existing "By file domain" split and the "Do not split when" list: deliverable-unit splitting stays for independent files, sections and reports, and slicing is for feature work.
      Do not carry over the source's steps that quiz the user or publish tickets to a tracker.
      Part 2: a line `Placement: under "## Decomposition doctrine"` and a `Conflicts` section listing every sentence of the current planning.md that this draft contradicts or that needs rewording (write `none` when there is none).
      In ## Output give the file path, the target heading, and the conflicts.

      SCOPE: Read skills/dag-planning/references/planning.md IN FULL, skills/dag-planning/SKILL.md and the Phase 2 section of docs/improvement-plan.md. Fetch the source with `gh api repos/mattpocock/skills/contents/skills/engineering/to-tickets/SKILL.md --jq .content | base64 -d` and read it (MIT licensed: paraphrase it, do not paste long passages). Write ONLY notes/p2-2c-decomposition.md. Do not edit planning.md or any other file; the 2a, 2b and 2d drafts, the skill nodes and the integration node belong to other nodes. NEVER run git commit or git push, never run an install command (npm, bun add, pip, brew), never reload plugins (/reload-plugins), and never edit anything under .claude/.
      VERIFY: Re-read your file and confirm it contains each of these literal strings: `### Vertical slices and wide refactors`, `vertical slice`, `blast radius`, and the three words `expand`, `migrate`, `contract` each in backticks. The runtime checks the same strings after you report.
      STOP WHEN: the file exists with both parts and every literal string above is present. If `gh api` fails, do not invent the source text: end with `DAG_NODE_STATUS: failed: missing-input: gh api could not fetch the to-tickets source`.

  - id: draft-2d
    label: Draft 2d debug chain
    category: writing
    writes:
      - notes/p2-2d-debug-chain.md
    verify:
      - kind: file
        path: notes/p2-2d-debug-chain.md
        contains: "### Debug chain (diagnose run, then fix run)"
      - kind: file
        path: notes/p2-2d-debug-chain.md
        contains: "Reproduction command:"
      - kind: file
        path: notes/p2-2d-debug-chain.md
        contains: "Hypotheses:"
      - kind: file
        path: notes/p2-2d-debug-chain.md
        contains: "[DEBUG-"
      - kind: file
        path: notes/p2-2d-debug-chain.md
        contains: "dag-workflow:dag-node-debugging"
      - kind: file
        path: notes/p2-2d-debug-chain.md
        contains: "B2"
    prompt: |
      TASK: Write the draft of plan item 2d, the debug chain, as notes/p2-2d-debug-chain.md.
      Background: plan item 2d (docs/improvement-plan.md, section "Phase 2", item 2d) with decision D3 option (a): a bug with an unknown cause is handled by TWO runs, because a node's `verify` is fixed when its run starts and cannot reference a reproduction command that does not exist yet ("one run = one phase").
      - The diagnosis run's final Output holds (i) exactly ONE reproduction command that was already run once and failed: fast, deterministic, and confirming the user's symptom itself rather than a nearby failure; and (ii) 3 to 5 falsifiable hypotheses, each stated as "If X is the cause, changing Y will make the bug disappear or worse".
      - The fix run (started later under a NEW key, with those facts pasted into its prompts) puts that command into the fix node's `verify` as a command check, so the node passes only when the command exits 0.
      - Debug logging uses a unique tag such as `[DEBUG-a4f2]` so cleanup is one search. Confirming that tagged logs were removed cannot be expressed in the current verify schema, because "no match" is a non-zero exit of the usual search commands; that is backlog item B2 (an expected-exit option for command checks). The draft must say so and give the interim rule: the fix node's prompt requires the removal and its Output reports the search result for the tag, and the final audit repeats that search.
      The source is the mattpocock diagnosing-bugs skill.

      DELIVERABLE: notes/p2-2d-debug-chain.md with two parts.
      Part 1: the literal line `Target heading: ### Debug chain (diagnose run, then fix run)`, then the ready-to-paste doctrine text of that subsection (English, in the style of planning.md, at most 70 lines). It covers:
      - when to use it: the cause is unknown and a reproduction can be built; and how it relates to the existing in-run rule "Unknown cause: investigate, then fix" (the in-run form stays right when the fix node's verify can be an existing test command; the two-run form applies when the verify must be the reproduction command);
      - the diagnose run: read-only investigation lanes, then ONE diagnosis node with `load_skills: ["dag-workflow:dag-node-debugging"]` whose ## Output has the fields `Reproduction command:`, `Observed failure:` (exit code and the symptom line), `Hypotheses:` (3 to 5, ranked, each falsifiable) and `Root cause:` (file and line, or "not yet determined");
      - how the main conversation carries the command into the fix run: pasted into the fix prompt AND into the fix node's `verify` as an argv command check (it runs from the project root without a shell with a 30-second limit, so a slower loop must be narrowed first);
      - the red-capable rule: a command that already exits 0 before the fix proves nothing, so the diagnosis node must have seen it fail;
      - when no loop can be built: the diagnosis node ends with `DAG_NODE_STATUS: failed: clarification: <what is needed>` and the main conversation asks the user;
      - secrets are redacted in every command and output that is shown;
      - the debug-log tag and the interim cleanup rule above.
      Part 2: a line `Placement: next to "Unknown cause: investigate, then fix" under "## Decomposition doctrine", plus a one-sentence pointer under "## Composing runs"` and a `Conflicts` section listing every sentence of the current planning.md that this draft contradicts or that needs rewording (write `none` when there is none).
      In ## Output give the file path, the target heading, and the conflicts.

      SCOPE: Read skills/dag-planning/references/planning.md IN FULL, skills/dag-planning/SKILL.md, hooks/engine/verification.ts and the Phase 2 and backlog sections of docs/improvement-plan.md. Fetch the source with `gh api repos/mattpocock/skills/contents/skills/engineering/diagnosing-bugs/SKILL.md --jq .content | base64 -d` and read it (MIT licensed: paraphrase it, do not paste long passages). Write ONLY notes/p2-2d-debug-chain.md. Do not edit planning.md or any other file; the 2a, 2b and 2c drafts, the skill nodes and the integration node belong to other nodes. NEVER run git commit or git push, never run an install command (npm, bun add, pip, brew), never reload plugins (/reload-plugins), and never edit anything under .claude/.
      VERIFY: Re-read your file and confirm it contains each of these literal strings: `### Debug chain (diagnose run, then fix run)`, `Reproduction command:`, `Hypotheses:`, `[DEBUG-`, `dag-workflow:dag-node-debugging`, `B2`. The runtime checks the same strings after you report.
      STOP WHEN: the file exists with both parts and every literal string above is present. If `gh api` fails, do not invent the source text: end with `DAG_NODE_STATUS: failed: missing-input: gh api could not fetch the diagnosing-bugs source`.

  # ---- Wave 1b: vendored node skills (2e, D4 option b) and the MIT notices ----
  - id: skill-debugging
    label: Vendor the node debugging skill
    category: writing
    writes:
      - skills/dag-node-debugging/SKILL.md
    verify:
      - kind: file
        path: skills/dag-node-debugging/SKILL.md
        contains: "---\nname: dag-node-debugging\ndescription: "
      - kind: file
        path: skills/dag-node-debugging/SKILL.md
        contains: "DAG_NODE_STATUS: failed: clarification:"
      - kind: file
        path: skills/dag-node-debugging/SKILL.md
        contains: "[DEBUG-"
      - kind: file
        path: skills/dag-node-debugging/SKILL.md
        contains: "Reproduction command:"
      - kind: file
        path: skills/dag-node-debugging/SKILL.md
        contains: "THIRD_PARTY_NOTICES.md"
      - kind: command
        argv:
          - bun
          - "-e"
          - |-
            const text = require('fs').readFileSync('skills/dag-node-debugging/SKILL.md', 'utf8').toLowerCase()
            const banned = ['hitl', 'show the ranked list to the user', 'ask the user for', 'setup-matt-pocock', 'glossary.md']
            const left = banned.filter(phrase => text.includes(phrase))
            if (left.length > 0) {
              console.error('source phrases that wait for a user are still in the skill: ' + left.join(', '))
              process.exit(1)
            }
    prompt: |
      TASK: Write the plugin skill skills/dag-node-debugging/SKILL.md, an adaptation of the mattpocock diagnosing-bugs skill for DAG node workers (plan item 2e, decision D4 option b: vendor the extract as a dag-workflow skill, loaded by nodes with `load_skills: ["dag-workflow:dag-node-debugging"]`).
      Background: a DAG node worker cannot ask the user anything and nothing waits for an answer. Wherever the source would ask the user, wait for the user or show something to the user, the skill instead tells the worker to put the content in its ## Output or, when only the user can supply the missing information, to end the final report with `DAG_NODE_STATUS: failed: clarification: <question>`.

      DELIVERABLE: skills/dag-node-debugging/SKILL.md, English, at most 200 lines.
      - Frontmatter exactly in this shape (and nothing else in it): a line `---`, `name: dag-node-debugging`, `description: <one sentence: discipline for DAG nodes that diagnose or fix a failing behavior, loaded through load_skills>`, `when_to_use: <one sentence>`, a line `---`. Look at the frontmatter of skills/dag-planning/SKILL.md for the plugin's shape.
      - Body, in this order: a short intro naming the two node roles (the diagnosis node runs phases 1 to 4 and edits no tracked source file except temporary tagged instrumentation inside its declared write scope; the fix node runs phases 5 and 6 using the reproduction command its prompt provides); a Redact section (write `<REDACTED>` for every secret, quote only the signal lines of captured artifacts, and when redacted output is not enough end with a clarification failure); Phase 1 build a feedback loop (keep the full ordered list of ways to construct one, but drop the human-in-the-loop script option, which needs a person; tighten it; non-deterministic bugs aim for a higher reproduction rate; when no loop can be built the worker lists what it tried and ends with `DAG_NODE_STATUS: failed: clarification: <what environment access, redacted artifact or permission is needed>`; the completion criterion is ONE command that was already run at least once, red-capable, deterministic, fast and runnable unattended, and no hypothesis before it exists); Phase 2 reproduce and minimise; Phase 3 hypothesise (3 to 5 ranked, falsifiable, each as "If X is the cause, changing Y will make the bug disappear or worse"; the ranked list goes into ## Output, it is not shown to anyone first); Phase 4 instrument (one variable at a time; every debug log carries a unique tag such as `[DEBUG-a4f2]`; the performance branch); Phase 5 fix and regression test (the worker itself judges whether a correct seam exists; if none exists it records that as a finding in ## Output); Phase 6 cleanup (re-run the loop, the tagged logs are gone by a search for the tag, throwaway files deleted, the correct hypothesis stated in ## Output).
      - An `## Output template` section for the diagnosis node with the fields `Reproduction command:` (the exact argv line), `Observed failure:` (exit code and the symptom line), `Hypotheses:` (3 to 5, ranked, falsifiable) and `Root cause:` (file and line, or "not yet determined").
      - A final line of attribution: `Adapted from mattpocock/skills (MIT), skills/engineering/diagnosing-bugs; see THIRD_PARTY_NOTICES.md at the repository root.`
      - These source phrases must NOT appear in your file in any casing: `hitl`, `show the ranked list to the user`, `ask the user for`, `setup-matt-pocock`, `glossary.md`.
      In ## Output give the file path, the frontmatter name, and the line count.

