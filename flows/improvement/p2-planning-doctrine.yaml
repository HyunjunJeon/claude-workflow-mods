      - Plan item 2b: the subsection `### Safe-but-wrong audit checklist` makes these REQUIRED content of the final audit prompt: the artifact kind equals the requested kind, the deliverable can be re-run with new input, missing data is not shown as OK, 0 or empty, the verification proved behavior and not only file existence, and a shortfall is reported as `partial/supporting-output` and not as complete.
      - Plan item 2c: the subsection `### Vertical slices and wide refactors` keeps the split by deliverable unit, defines the unit of feature work as an end-to-end vertical slice, and sequences wide refactors as `expand`, then `migrate` batches by blast radius, then `contract`, as a chain.
