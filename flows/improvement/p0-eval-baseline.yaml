  - id: baseline-combine
    label: Combine the shard tables into the P0 baseline
    category: quick
    dependsOn:
      - shard-1
      - shard-2
      - shard-3
      - shard-4
    writes:
      - eval/baselines/p0-baseline.md
    verify:
      - kind: file
        path: eval/baselines/p0-baseline.md
        contains: "| scenario | expected | runs | shape |"
      - kind: file
        path: eval/baselines/p0-baseline.md
        contains: "Scenarios matching their expected shape:"
      - kind: file
        path: eval/baselines/p0-baseline.md
        contains: "## Sources"
      - kind: command
        argv:
          - bun
          - -e
          - |
            const fs = require('node:fs')
            const ids = ['single-edit', 'parallel-files', 'map-reduce-docs', 'pipeline-stats', 'diamond-app', 'debug-fix', 'wide-harvest', 'research-write']
            const fail = msg => { console.error(msg); process.exit(1) }
            const text = fs.readFileSync('eval/baselines/p0-baseline.md', 'utf8')
            const lines = text.split('\n')
            const results = []
            for (let k = 1; k <= 4; k++) {
              const shard = fs.readFileSync(`eval/baselines/p0-shard-${k}.md`, 'utf8')
              const m = /^Results JSON: (eval\/results\/\d{14}\.json)$/m.exec(shard)
              if (!m) fail(`shard ${k}: no Results JSON line`)
              results.push(...JSON.parse(fs.readFileSync(m[1], 'utf8')).results)
            }
            if (results.map(r => r.id).sort().join() !== [...ids].sort().join()) fail(`the shard results hold ${results.map(r => r.id).join()}, expected each of ${ids.join()} once`)
            const all = ids.map(id => results.find(r => r.id === id))
            const rows = lines.filter(l => ids.some(id => l.startsWith(`| ${id} |`)))
            if (rows.length !== 8) fail(`expected 8 scenario rows, found ${rows.length}`)
            all.forEach((r, i) => {
              const cell = r.runs.map(x => `${x.shape} (producers: ${x.producerShape})`).join('; ') || 'no run'
              if (!rows[i].startsWith(`| ${r.id} | ${r.expect} |`) || !rows[i].includes(`| ${cell} |`) || !rows[i].endsWith(`| ${r.seconds}s |`)) fail(`row ${i + 1} (${r.id}) does not match its Results JSON result`)
            })
            const runs = all.flatMap(r => r.runs)
            const shapes = new Set(runs.map(x => x.shape))
            const matches = all.filter(r => r.runs.some(x => x.shape === r.expect || x.producerShape === r.expect)).length
            const verified = runs.reduce((n, x) => n + x.verificationTotals.verifiedNodes, 0)
            const total = runs.reduce((n, x) => n + x.nodeVerification.length, 0)
            if (!text.includes(`Distinct shapes: ${shapes.size} (`)) fail(`the Distinct shapes line should say ${shapes.size}`)
            if (!text.includes(`Scenarios matching their expected shape: ${matches}/8.`)) fail(`the matching line should say ${matches}/8`)
            if (!text.includes(`Verification: ${verified}/${total} nodes verified`)) fail(`the Verification line should say ${verified}/${total} nodes verified`)
    prompt: |
      TASK: Merge the four shard files into eval/baselines/p0-baseline.md, the combined P0 eval baseline with one table row for each of the 8 shape scenarios and summary lines recomputed from the runner JSON results.
      DELIVERABLE: eval/baselines/p0-baseline.md with, in this order:
        1. the line "# P0 eval baseline"
        2. the lines "Date: <output of date +%F>", "Plugin HEAD: <the hash named in the shard files; when they differ write shard-<k>:<hash> for each>", "Tracked changes: <the number named in the shard files, same rule>" and "Runner: bun eval/run.ts in 4 shards of 2 scenarios, --concurrency 1 --timeout-min 4 each, model <model from options.model in the Results JSON>"
        3. the two summary lines, in the runner's own format, recomputed as described below
        4. the table header line and separator line copied from eval/baselines/p0-shard-1.md, then the 8 scenario rows copied verbatim from the shard files in exactly this order: single-edit, parallel-files, map-reduce-docs, pipeline-stats, diamond-app, debug-fix, wide-harvest, research-write
        5. a section "## Sources" with one line per shard in the form "- shard-<k>: Stamp <stamp>, <Results JSON path>, scenarios <id>, <id>".
        Summary line formats (recompute the numbers from the 8 results of the Results JSON files, in the scenario order above):
          Distinct shapes: <N> (<shapes joined by ", ">). Distinct producer shapes: <M> (<producer shapes joined by ", ">). Scenarios matching their expected shape: <X>/8.
          Verification: <V>/<T> nodes verified, <F> failed, <G> missing; automatic retries: <R>; start/amend refusals: <A> verification_required, <B> invalid_verification.
        where N and M count the distinct values of runs[].shape and runs[].producerShape over all runs of all 8 results (list them in first-seen order); X counts the scenarios having a run whose shape or producerShape equals the scenario expect value; V, F, G and R sum runs[].verificationTotals.verifiedNodes, failedVerification, missingVerification and autoRetries; T sums the lengths of runs[].nodeVerification; A and B sum transcript.verificationRequired and transcript.invalidVerification over the 8 results.
        In ## Output give the two summary lines and, per scenario, the shape, the expected shape and the outcome check (PASS or FAIL).
      SCOPE: Read eval/baselines/p0-shard-1.md to p0-shard-4.md, the Results JSON files they name under eval/results/, and eval/run.ts (the markdown function, for the summary line formats). Write only eval/baselines/p0-baseline.md. Compute the numbers with a read-only bun -e script that prints them; do not write script files. Do not edit the shard files, do not run the eval runner. NEVER commit, push, install anything or reload plugins, and never edit anything under .claude/.
      VERIFY: Count the table rows (exactly 8, each copied unchanged from a shard file) and recompute the summary numbers a second time with a different expression of the same rule. The runtime also runs a script that compares every row and the summary lines with the Results JSON files.
      STOP WHEN: eval/baselines/p0-baseline.md exists with 8 rows, both summary lines and the Sources section, and your ## Output section is written.

  - id: baseline-audit
    label: Audit the baseline against the result JSON files
    category: unspecified-low
    dependsOn:
      - shard-1
      - shard-2
      - shard-3
      - shard-4
      - baseline-combine
    writes:
      - eval/baselines/p0-baseline-audit.md
    verify:
      - kind: file
        path: eval/baselines/p0-baseline-audit.md
        contains: "Baseline audit: PASS"
      - kind: file
        path: eval/baselines/p0-baseline-audit.md
        contains: "Rows compared: 8/8"
      - kind: file
        path: eval/baselines/p0-baseline-audit.md
        contains: "Cells compared: 160/160"
      - kind: file
        path: eval/baselines/p0-baseline-audit.md
        contains: "Summary lines: PASS"
      - kind: file
        path: eval/baselines/p0-baseline-audit.md
        contains: "Shard coverage: PASS"
    prompt: |
      TASK: Falsify eval/baselines/p0-baseline.md row by row against the eval/results/*.json files that the four shards produced, and write the verdict to eval/baselines/p0-baseline-audit.md.
      DELIVERABLE: eval/baselines/p0-baseline-audit.md containing, in this order:
        1. the line "# P0 baseline audit"
        2. a table with the header "| scenario | cells compared | mismatches | verdict |" and one row for each of the 8 scenarios
        3. the lines "Rows compared: <n>/8", "Cells compared: <n>/160" (each row has 20 cells), "Summary lines: PASS or FAIL" and "Shard coverage: PASS or FAIL", using the real numbers and verdicts you found
        4. as the last line "Baseline audit: PASS" only when every row verdict, the summary lines and the shard coverage pass; otherwise "Baseline audit: FAIL" followed by one bullet per mismatch (scenario, cell, value in the baseline, value in the JSON).
        In ## Output give the verdict and the real figures: X (scenarios matching their expected shape, out of 8), V and T (verified and total nodes from the Verification line), and the scenarios whose outcome check is FAIL, whose shape differs from the expected one or that timed out. Those are baseline measurements, not audit failures.
      SCOPE: Read eval/baselines/p0-baseline.md, eval/baselines/p0-shard-1.md to p0-shard-4.md, the eval/results/<stamp>.json files that the shard files name, the markdown function in eval/run.ts and verificationOf in eval/report.ts. Treat the upstream Outputs and the baseline file as claims; the Results JSON files are the evidence. Write only eval/baselines/p0-baseline-audit.md. Do not fix the baseline: report each mismatch. You may run a read-only bun -e script that prints its findings; do not write script files and do not run the eval runner. NEVER commit, push, install anything or reload plugins, and never edit anything under .claude/.
      Procedure:
        1. Shard coverage: every shard file names a Results JSON file that exists; the four stamps are distinct; shard 1 holds single-edit and parallel-files, shard 2 holds map-reduce-docs and pipeline-stats, shard 3 holds diamond-app and debug-fix, shard 4 holds wide-harvest and research-write, each id exactly once across the four files.
        2. Rows: for each of the 8 scenarios recompute all 20 cells from its JSON result exactly as the markdown function in eval/run.ts renders them (scenario, expected, runs, shape with producers, nodes, depth, layer widths, fan-in nodes, verify node, warnings, categories, status, outcome check, skill before start, refusals, verify refusals, verified/total nodes, auto retries, unfinished nodes, time) and compare them cell by cell with the row in eval/baselines/p0-baseline.md and with the row in its shard file.
        3. Summary lines: recompute Distinct shapes, Distinct producer shapes, Scenarios matching their expected shape and the Verification line from the 8 results and compare them with the baseline file. Compare the Sources section with the shard files.
      VERIFY: Run your comparison a second time with a different expression of the same rule and confirm that the mismatch count is identical; PASS needs 8 rows, 160 equal cells, matching summary lines and complete shard coverage.
      STOP WHEN: eval/baselines/p0-baseline-audit.md is written and your ## Output section is given. When any comparison fails, write the file with Baseline audit: FAIL and report DAG_NODE_STATUS: failed with the mismatch.

  - id: progress-log
    label: Record P0 in the progress table
    category: quick
    dependsOn:
      - baseline-audit
    writes:
      - docs/improvement-plan.md
    verify:
      - kind: file
        path: docs/improvement-plan.md
        contains: "| P0 | 완료 | 20"
      - kind: file
        path: docs/improvement-plan.md
        contains: "eval/baselines/p0-baseline.md"
      - kind: file
        path: docs/improvement-plan.md
        contains: "run dag_"
    prompt: |
      TASK: Update ONLY the P0 row of the table under "## 진행 기록" in docs/improvement-plan.md to record this completed run.
      DELIVERABLE: In docs/improvement-plan.md the P0 row (it reads "| P0 | 대기 | | |" before this run) becomes "| P0 | 완료 | <date> | <memo> |", where:
        - <date> is the output of the Bash command date +%F (format YYYY-MM-DD)
        - <memo> is one line in Korean without any "|" character, in the form: run <run id>: 8개 시나리오 중 <X>/8 형태 일치, 검증 <V>/<T> 노드, 기준선 eval/baselines/p0-baseline.md
        - <run id> is the run id of this run, the dag_... id in the plugin header line above this task, which reads (run dag_..., attempt N)
        - X, V and T come from the ## Output of baseline-audit (the upstream result pasted into this prompt); they equal the summary lines of eval/baselines/p0-baseline.md.
        Every other character of the file stays unchanged: the P1, P2 and P3 rows, the header row and every other section. In ## Output give the new P0 row.
      SCOPE: Read docs/improvement-plan.md and eval/baselines/p0-baseline.md. Edit only the P0 row of the "## 진행 기록" table in docs/improvement-plan.md. Do not touch any other row or section, any other file, or the baseline files. Phase 0 steps for the user (commit, decisions D1-D5, access to the shared document) stay as they are. NEVER commit, push, install anything or reload plugins, and never edit anything under .claude/.
      VERIFY: Read docs/improvement-plan.md back and confirm that the P0 row shows 완료, a YYYY-MM-DD date and the memo, and that the P1, P2 and P3 rows are unchanged.
      STOP WHEN: the P0 row holds the status, date and memo and your ## Output section is written.
