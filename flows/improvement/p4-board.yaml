  - id: board-view
    label: Board section view model with pagination
    category: trivial
    dependsOn:
      - flow-layout
      - sequence-layout
      - board-blocks
    load_skills:
      - dag-workflow:testing
      - dag-workflow:anti-slop
    writes:
      - hooks/ui/board-model.ts
      - tests/board-view.test.ts
    verify:
      - kind: file
        path: hooks/ui/board-model.ts
        contains: "export function buildBoardView("
      - kind: file
        path: hooks/ui/board-model.ts
        contains: "보드"
      - kind: command
        argv: [claude, plugin, test, "."]
      - kind: command
        argv: [bunx, "-p", "typescript@5", tsc, "-p", ".", "--noEmit"]
    prompt: |
      TASK: Build the /dag pane's Board section view model in hooks/ui/board-model.ts.
      CONTEXT: The pane already renders its Decisions, Context and Sessions sections through hooks/ui/inspector-client.ts from an InspectorModel `{ title, lines, actions }` (hooks/ui/inspector-model.ts, which paginates with actions `page:prev` and `page:next`); the Board section uses the same client and model shape. Types: hooks/engine/board-types.ts. The renderers come from the upstream nodes (their Outputs list the exact signatures): flowLines in hooks/ui/flow-layout.ts, sequenceLines in hooks/ui/sequence-layout.ts, sectionLines, calloutLines, tableLines and codePeekLines in hooks/ui/board-blocks.ts. Language is 'en' | 'ko' from hooks/ui/i18n.ts. hooks/ui/ is pure. Every UI string exists in both English and Korean (AGENTS.md).
      DELIVERABLE:
      (1) hooks/ui/board-model.ts exporting `type BoardViewInput = { boards: readonly Board[]; selectedBoardId?: string; columns: number; language: Language; page: number }`, `buildBoardView(input: BoardViewInput): InspectorModel` and `adjacentBoardId(boards: readonly Board[], selectedBoardId: string | undefined, step: 1 | -1): string | undefined`. The shown board is the selected one, else the most recently updated. Title: `<board title> (<index>/<count>)`, or with no boards a title `Board` / `보드` and one dim line `No board yet. The model draws one with the board tool.` / `아직 보드가 없습니다. 모델이 board 툴로 그립니다.`. Each block starts with a dim header line `[<id>] <type>` plus ` · <title>` when the block has one, then its renderer's lines, then a blank line. Pack whole blocks into pages of at most 60 lines; a block longer than a page gets a page of its own, cut with a dim `… <n> more lines` / `… <n>줄 더` line. A dim `page i/n` / `페이지 i/n` footer when there is more than one page. Actions: `board:prev` and `board:next` (labels `prev board`/`이전 보드`, `next board`/`다음 보드`) when there is more than one board; `page:prev` and `page:next` (same labels as inspector-model's) when there is more than one page and the move is possible. Localized labels for callout tones (info/정보, decision/결정, risk/위험, warning/주의) and for the flow layout (sameFrontier, more) live in this file in both languages. Every line is clipped to columns; columns <= 0 returns an empty model like buildInspector does.
      (2) tests/board-view.test.ts (import test and expect from 'claude-code/testing'): the empty state in both languages; a board with one block of each of the six types shows each `[b<n>]` header; selection falls back to the latest updatedAt; adjacentBoardId wraps around; a board taller than 60 lines paginates and shows the page actions and footer; a block longer than a page is cut with the more-lines line.
      In ## Output give the exported names and signatures, the action ids and the test names; board-host consumes them.
      SCOPE: Write ONLY hooks/ui/board-model.ts and tests/board-view.test.ts. Do not edit the renderer files; if a renderer's signature differs from its node's Output, follow the file. Never commit, push, install or reload plugins.
      VERIFY: `command claude plugin test .` exits 0 with 0 failing tests; `bunx -p typescript@5 tsc -p . --noEmit` exits 0.
      STOP WHEN: both commands exit 0 and the test cases above exist.

  - id: board-host
    label: Wire the board tool, persistence, retention and the Board pane section
    category: hard
    dependsOn:
      - board-engine
      - board-view
      - board-retention
    load_skills:
      - dag-workflow:testing
      - dag-workflow:anti-slop
    writes:
      - hooks/register.ts
      - hooks/engine/policy.ts
      - tests/policy.test.ts
      - tests/board-host.test.ts
    verify:
      - kind: file
        path: hooks/register.ts
        contains: "BOARD_TOOL_DESCRIPTION"
      - kind: file
        path: hooks/register.ts
        contains: "buildBoardView("
      - kind: file
        path: hooks/engine/policy.ts
        contains: "mcp__dag-workflow__board"
      - kind: file
        path: tests/board-host.test.ts
        contains: "mcp__dag-workflow__board"
      - kind: command
        argv: [claude, plugin, test, "."]
      - kind: command
        argv: [claude, plugin, validate, "."]
      - kind: command
        argv: [bunx, "-p", "typescript@5", tsc, "-p", ".", "--noEmit"]
    prompt: |
      TASK: Wire the board feature into the host: register and serve the tool mcp__dag-workflow__board, persist boards, prune them with retention, allow the tool in the main conversation, and add a Board section to the /dag pane.
      CONTEXT: Read the root AGENTS.md first: every `$` call lives in hooks/register.ts, state mutations go through `serialized()`, engine/ and ui/ stay pure. The upstream Outputs give the exact signatures: board-engine (newBoard, parseEdits, peeksNeeded, peekKey, applyEdits, boardForModel, parseBoardFile, BOARD_TOOL_DESCRIPTION, BOARD_INPUT_SCHEMA, error codes), board-view (buildBoardView, adjacentBoardId, action ids board:prev/board:next/page:prev/page:next), board-retention (RetentionInput.boardFiles, RetentionPlan.boardFiles). Follow how hooks/register.ts already does the matching thing for the dag tool and the inspector sections; read before writing.
      DELIVERABLE in hooks/register.ts:
      (1) In the session.start hook, next to the dag tool's `$.tool.register(...)`, register `{ name: 'board', description: BOARD_TOOL_DESCRIPTION, inputSchema: BOARD_INPUT_SCHEMA }`, then load this session's boards from `${projectRoot}/.claude/dag/boards/${sessionId}.json` with parseBoardFile (a missing file means no boards; an unreadable or invalid file is logged with $.ui.log and treated as no boards, never thrown).
      (2) `on('tool.call', { tool: 'mcp__dag-workflow__board' }, ...)` running `serialized(() => handleBoardTool($, e))`, with a `.catch` like the dag tool's. Actions: create {title} makes the board with id `board_${now.toString(36)}_${Math.random().toString(36).slice(2, 8)}` (the run-id pattern), selects it and returns {board_id}; edit {board_id, edits} runs parseEdits, peeksNeeded, reads each requested range from `${projectRoot}/${path}` with $.fs.read (lines start..end, 1-based; a missing file, or an end past the last line, is a tool error with code `invalid_board_edit` naming the path and, when the file exists, its line count; it names no edit index, because peeksNeeded deduplicates ranges across edits), applyEdits with the peeks and $.clock.now(), persists, selects the board, calls `$.ui.invalidate('ui.render')` and returns {board_id, blocks: [{id, type}], inserted}; get {board_id} returns boardForModel as JSON; list returns this session's boards as [{board_id, title, blocks, updatedAt}]; open {board_id} selects the board, switches the pane to the Board section at page 0 and opens the pane the way the model-driven openPane($, false) does (no keyboard focus; respects a pane the user closed). Errors use err(...) with the engine's codes; an unknown board_id is `unknown_board`. Persist with ensureDir on `${projectRoot}/.claude/dag/boards` and $.fs.write of `{ schemaVersion: 1, sessionId, boards }` (JSON, two-space indent), only after an edit or create succeeded.
      (3) pruneArtifacts: pass `boardFiles` from the boards folder (as contextFiles is passed) and remove the planned board files the same way context files are removed.
      (4) Pane: add `{ id: 'board', label: language === 'ko' ? '보드' : 'Board', key: 'b' }` to the section tabs in drawPane; extend the inspector view state to include 'board'; when it is 'board', render buildBoardView({ boards: this session's boards, selectedBoardId, columns: inspectorColumns, language, page: inspectorPage }) through the same inspector-client Client (and the same no-Client fallback) the other sections use; handle the actions board:prev/board:next (adjacentBoardId, page back to 0) and page:prev/page:next (inspectorPage) where inspector actions are handled. `/dag inspect board` selects the section like the other inspect choices; add `board` to that command's choices and to USAGE.
      DELIVERABLE elsewhere: (5) hooks/engine/policy.ts: add 'mcp__dag-workflow__board' to MAIN_LOOP_TOOLS, so strict enforcement lets the main conversation draw; tests/policy.test.ts asserts the main conversation may call it under strict. (6) tests/board-host.test.ts on tests/control-harness.ts (see tests/AGENTS.md; do NOT edit control-harness.ts): create, then edit inserting a section, a flow and a code_peek of a file placed in the harness fs, then get shows lineCount, then the persisted /work/.claude/dag/boards/<session id>.json parses with parseBoardFile; an invalid edit returns an error and leaves the persisted file unchanged; a code_peek of a missing file returns an error naming the path; list returns the board; an unknown board_id returns unknown_board. If the harness can render the pane, add a test that the Board section shows `[b1]`; otherwise state in Output that pane rendering is covered by tests/board-view.test.ts only.
      Do NOT change protocolFor or any skill text (P2 does that). In ## Output give: the actions and what each returns, the error codes, the persisted path and shape, the hotkey and command, the pane behaviour of open, and the plugin test pass count; board-docs documents exactly this.
      SCOPE: Write ONLY hooks/register.ts, hooks/engine/policy.ts, tests/policy.test.ts and tests/board-host.test.ts. Every other file belongs to an upstream node: if one needs a change, end with `DAG_NODE_STATUS: failed: missing-input: <file and change>`. Never commit, push, install or reload plugins.
      VERIFY: `command claude plugin test .` exits 0 with 0 failing tests; `command claude plugin validate .` exits 0 (its existing ".catch" warnings are known); `bunx -p typescript@5 tsc -p . --noEmit` exits 0.
      STOP WHEN: the three commands exit 0 and the tests above exist.

