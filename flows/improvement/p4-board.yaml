      CONTEXT: Boards persist one file per session at .claude/dag/boards/<sessionId>.json (BoardFile in hooks/engine/board-types.ts), named exactly like the context and decision files that retentionPlan already prunes with its pickFiles rule (never the current session, never a live session, never a session that still owns a kept run, only files older than the cutoff).
