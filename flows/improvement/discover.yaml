      1. Merge: candidates with one root cause become one item that cites all their ids. Use only CONFIRMED candidates as evidence. List every REFUTED and UNCHECKED id under 기각한 후보 with the verifier's reason.
      2. Rank with this rubric and show each grade:
         Impact: H = a run or node reports success on a wrong or unverified result, or user work or state is lost; M = a run or node fails, needs a manual fix or retry, or the user or an agent is misled; L = slowness, noise or cosmetic.
         Breadth: the number of independent observations behind the item (runs, sessions, files, lanes).
         Cost: S = one module and its tests; M = two to four modules; L = wiring across features in hooks/register.ts, or a new capability.
         Order by impact, then breadth (more first), then cost (cheaper first). The table holds at most 10 items; put the rest under 그 밖의 후보, one line each.
      3. Write the file in Korean prose. Identifiers, paths, commands, quoted code and every Draft goal stay in English: a Draft goal becomes a definition goal, and agent-read prompts in this project are English. Use exactly this layout (without the leading indentation; replace each <...>):
